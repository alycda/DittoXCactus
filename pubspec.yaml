name: mesh_rag
description: >
  Mesh-RAG demo (Ditto × Cactus, iOS + Android). Two phones each hold a slice
  of a study-notes corpus; they meet over BLE/Wi-Fi and the vector index
  merges as a CRDT, so a query on one phone draws on the other's notes after
  handshake — with WAN off. See _docs/SEED.md and _docs/IDEA-A.md.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '^3.8.0'

# Direct dependencies kept deliberately minimal (5). device_info_plus,
# package_info_plus, objectbox_flutter_libs, record, path_provider, and
# shared_preferences come in transitively via cactus + ditto_live and don't
# need re-declaring — keeping them out keeps the pubspec honest about what
# the app actually uses directly.
dependencies:
  flutter:
    sdk: flutter
  cactus: ^1.3.0
  ditto_live: ^5.0.0
  permission_handler: ^12.0.1
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed_notes_a.json
    - assets/seed_notes_b.json
